[package]
name = "csustkit"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.1"
base64 = "0.22.1"
cbc = { version = "0.2.1", features = ["alloc"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "cookies", "json", "form", "gzip", "brotli", "deflate", "http2", "system-proxy"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
uniffi = { version = "0.32.0", features = ["tokio"] }
