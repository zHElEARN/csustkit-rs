[package]
name = "csustkit"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "csustkit-bindgen"
path = "tools/csustkit-bindgen.rs"
required-features = ["uniffi-bindgen"]

[features]
uniffi = ["dep:uniffi", "dep:jni", "dep:rustls-platform-verifier"]
uniffi-bindgen = ["uniffi", "uniffi/cli"]

[dependencies]
aes = "0.9.1"
base64 = "0.22.1"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { version = "0.4.41", default-features = false, features = ["serde", "std"] }
cookie_store = { version = "0.22.1", default-features = false }
encoding_rs = "0.8.35"
getrandom = "0.4.3"
hex = "0.4.3"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "cookies", "json", "form", "gzip", "brotli", "deflate", "http2", "system-proxy"] }
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["time"] }
uniffi = { version = "=0.32.2", optional = true, features = ["tokio"] }
url = { version = "2.5.8", features = ["serde"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false, optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }

[dev-dependencies]
dotenvy = "0.15"
rpassword = "7"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
