[package]
name = "csustkit"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
aes = "0.9.1"
base64 = "0.22.1"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { version = "0.4.41", default-features = false, features = ["serde", "std"] }
encoding_rs = "0.8.35"
getrandom = "0.4.3"
hex = "0.4.3"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "cookies", "json", "form", "gzip", "brotli", "deflate", "http2", "system-proxy"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2.5.8"
